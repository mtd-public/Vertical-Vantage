<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>Vertical Vantage</title>
  <meta name="description" content="A retro first-person platform shooter: triple-jump across hover cars and billboards over a neon future city.">
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- touch-zoom guard CSS first so the game CSS can override it -->
  <link rel="stylesheet" href="touch-zoom-guard/touch-zoom-guard.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch-zone" class="hidden" data-touch-control></div>

  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="lbl">INTEGRITY</div>
      <div id="hp" class="cells"></div>
      <div id="powers" class="powers"></div>
    </div>
    <div class="hud-tc">
      <div id="drives" class="drives"></div>
      <div id="objective" class="objective">RECOVER 3 DATA DRIVES</div>
    </div>
    <div class="hud-tr">
      <div class="score"><span class="lbl">SCORE</span><span id="score" class="num">000000</span></div>
      <div class="score"><span class="lbl">TIME</span><span id="clock" class="num">0:00</span></div>
      <div class="corner-btns" data-touch-allow>
        <button id="mute-btn" class="mini" aria-label="Mute">♪</button>
        <button id="pause-btn" class="mini" aria-label="Pause">II</button>
      </div>
    </div>
    <div class="hud-l">
      <div class="alt"><div id="alt-fill"></div><div id="alt-mark"></div></div>
      <div id="alt-num" class="num small">0m</div>
      <div id="pips" class="pips"><i></i><i></i><i></i></div>
      <div class="lbl tiny">JUMP</div>
    </div>
    <div class="hud-br">
      <div id="weapon" class="weapon">BLASTER</div>
      <div id="ammo" class="num ammo">∞</div>
    </div>
    <div id="bonus-hud" class="bonus-hud hidden">
      <div id="bonus-time" class="bonus-time">30.0</div>
      <div id="bonus-count" class="bonus-count">SERVERS 0/0</div>
    </div>
    <div id="boss-hud" class="boss-hud hidden">
      <div id="boss-name" class="boss-name">ARACHNE-9</div>
      <div class="boss-bar"><div id="boss-fill"></div><i style="left:60%"></i><i style="left:30%"></i></div>
    </div>
    <div id="slowmo"></div>
    <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
    <div id="hitmark"></div>
    <div id="drop" class="hidden"></div>
    <div id="markers"></div>
    <div id="floaters"></div>
    <div id="toasts"></div>
    <div id="vignette"></div>
    <div id="avatar" class="avatar" aria-hidden="true"></div>
  </div>

  <div id="touch-ui" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-swap" class="tbtn swap" aria-label="Swap weapon">⇄</button>
    <button id="btn-fire" class="tbtn fire" aria-label="Fire (drag to aim)">FIRE</button>
    <button id="btn-jump" class="tbtn jump" aria-label="Jump">JUMP</button>
  </div>

  <div id="screen" class="screen" data-touch-allow></div>
  <div class="scanlines"></div>
  <div class="tzg-hint zoom-hint">Pinch out to reset zoom</div>

  <script src="touch-zoom-guard/touch-zoom-guard.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

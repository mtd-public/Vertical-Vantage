<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO sheet</title>
  <link rel="icon" href="data:,">
  <!-- Art-bible page: every ECHO expression at once. Serve the repo root, open /tools/echo-sheet.html -->
  <style>
    body { margin: 0; padding: 16px; background: #0b0820; color: #cfe9ff; font: 12px ui-monospace, monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, 132px); gap: 14px; }
    .cell { text-align: center; }
    .avatar { width: 120px; height: 120px; margin: 0 auto 4px; position: relative; }
    .avatar canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    .av-say { display: none; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { Avatar } from '../js/ui/avatar.js';
    const EXPRS = ['idle', 'blink', 'happy', 'smug', 'manic', 'sparkle', 'love', 'hurt', 'angry', 'serious', 'shock', 'dizzy', 'worried', 'cry', 'derp', 'dead'];
    const grid = document.getElementById('grid');
    const avs = EXPRS.map((e) => {
      const cell = document.createElement('div'); cell.className = 'cell';
      const box = document.createElement('div'); box.className = 'avatar';
      cell.append(box, Object.assign(document.createElement('div'), { textContent: e }));
      grid.append(cell);
      const av = new Avatar(box);
      return { av, e };
    });
    let last = performance.now();
    (function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (const { av, e } of avs) {
        av.t += dt; av.blink = e === 'blink' ? -0.05 : 5;
        av.expr = e === 'blink' ? 'idle' : e;
        av.draw();
      }
      requestAnimationFrame(frame);
    })(last);
  </script>
</body>
</html>
